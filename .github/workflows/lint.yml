name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          # no git hooks needed in CI
          HUSKY: 0

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint
